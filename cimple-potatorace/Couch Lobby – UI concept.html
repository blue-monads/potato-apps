<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Couch Lobby – UI concept</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#0d0f1a;--panel:#171a2b;--line:#2a2f4a;--txt:#f1f3ff;--mut:#8c93b8;--acc:#7c5cff;--ok:#2ee59d;--warn:#ffb84d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:14px 18px;flex-wrap:wrap}
header b{font-size:16px}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:10px}
.tabs button{border:0;background:none;color:var(--mut);padding:6px 12px;border-radius:7px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
.stage{display:flex;gap:28px;align-items:center;justify-content:center;padding:10px 18px 30px;flex-wrap:wrap}
.stage.only-tv .phone,.stage.only-phone .tv{display:none}
/* TV */
.tv{width:min(720px,100%);aspect-ratio:16/9;background:#05060c;border:10px solid #22263d;border-radius:14px;position:relative;overflow:hidden;box-shadow:0 20px 60px #0008}
.tv-in{position:absolute;inset:0;padding:4%;display:flex;flex-direction:column;background:radial-gradient(circle at 20% 0,#241a5c 0,transparent 55%),#0a0c18}
.tv h2{margin:0;font-size:clamp(11px,1.8vw,16px);letter-spacing:.15em;color:var(--mut);font-weight:600}
.codebox{display:flex;align-items:center;gap:4%;margin:3% 0}
.code{font-size:clamp(34px,9vw,84px);font-weight:800;letter-spacing:.12em;line-height:1}
.qr{width:clamp(50px,11vw,100px);aspect-ratio:1;border-radius:6px;background:conic-gradient(#fff 25%,#000 0 50%,#fff 0 75%,#000 0) 0 0/20% 20%;border:5px solid #fff}
.hint{color:var(--mut);font-size:clamp(10px,1.6vw,14px)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:2.5%;margin-top:auto}
.slot{border:2px dashed var(--line);border-radius:12px;padding:8% 4%;text-align:center;font-size:clamp(10px,1.7vw,15px);color:var(--mut);transition:.2s}
.slot.f{border:2px solid var(--c);color:var(--txt);background:#ffffff08}
.slot .av{width:34%;aspect-ratio:1;border-radius:50%;background:var(--c);margin:0 auto 8%}
.slot small{display:block;font-weight:700;color:var(--mut)}
.slot.r small{color:var(--ok)}
.big{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(60px,18vw,160px);font-weight:900;background:#0009}
.arena{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 40px),#0a0c18}
.pl{position:absolute;width:5%;aspect-ratio:1;border-radius:50%;background:var(--c);transform:translate(-50%,-50%);box-shadow:0 0 18px var(--c)}
.pl i{position:absolute;top:-1.6em;left:50%;transform:translateX(-50%);font:normal 600 11px system-ui;white-space:nowrap}
.pl.me{outline:3px solid #fff}
.coin{position:absolute;width:3%;aspect-ratio:1;background:var(--warn);border-radius:50%;transform:translate(-50%,-50%)}
.pulse{animation:p .25s}
@keyframes p{50%{transform:translate(-50%,-50%) scale(1.5)}}
/* phone */
.phone{width:300px;height:620px;background:#05060c;border:9px solid #22263d;border-radius:42px;position:relative;overflow:hidden;box-shadow:0 20px 60px #0008;flex:none}
.phone::before{content:"";position:absolute;top:8px;left:50%;width:80px;height:20px;background:#22263d;border-radius:12px;transform:translateX(-50%);z-index:5}
.scr{position:absolute;inset:0;padding:44px 18px 22px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.scr h1{margin:0;font-size:22px}
.scr p{margin:0;color:var(--mut)}
label{font-size:12px;color:var(--mut);letter-spacing:.08em}
input{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:12px;color:var(--txt);font:inherit;font-size:18px;padding:13px;outline:0}
input:focus{border-color:var(--acc)}
input.code-in{text-align:center;font-size:32px;font-weight:800;letter-spacing:.3em;text-transform:uppercase}
.btn{border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--acc);cursor:pointer;touch-action:manipulation}
.btn.ok{background:var(--ok);color:#06281b}
.btn.ghost{background:none;color:var(--mut);padding:8px}
.btn:disabled{opacity:.4}
.shake{animation:s .35s}
@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.err{color:#ff6b81;font-size:13px;min-height:18px}
.list{display:flex;flex-direction:column;gap:8px;overflow:auto}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);padding:10px 12px;border-radius:12px}
.row .av{width:28px;height:28px;border-radius:50%;background:var(--c)}
.row span{flex:1}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:#ffffff14;color:var(--mut)}
.tag.r{background:#2ee59d22;color:var(--ok)}
.pill{align-self:flex-start;background:var(--panel);padding:4px 12px;border-radius:20px;font-weight:700;letter-spacing:.2em}
/* controller (landscape feel inside portrait phone: rotate) */
.ctl{position:absolute;inset:0;background:#0b0d17;touch-action:none;user-select:none}
.ctl .top{position:absolute;top:44px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;align-items:center;color:var(--mut);font-size:12px}
.ctl .top b{color:var(--txt)}
.stick{position:absolute;left:50%;bottom:190px;width:170px;height:170px;margin-left:-85px;border-radius:50%;background:var(--panel);border:2px solid var(--line)}
.knob{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:var(--acc);box-shadow:0 4px 18px #7c5cff88}
.ab{position:absolute;bottom:50px;width:92px;height:92px;border-radius:50%;border:0;color:#fff;font:800 26px system-ui;touch-action:none}
.ab.a{right:30px;background:#e5484d}.ab.b{left:30px;background:#2f7bff}
.ab:active,.ab.dn{transform:scale(.92);filter:brightness(1.3)}
.ctl .lbl{position:absolute;bottom:158px;width:100%;text-align:center;font-size:11px;color:var(--mut);letter-spacing:.1em}
</style>
</head>
<body>
<header>
  <b>🛋️ Couch Lobby <span style="color:var(--mut);font-weight:400">· UI concept</span></b>
  <div class="tabs" id="tabs">
    <button data-v="both" class="on">Both</button><button data-v="tv">TV</button><button data-v="phone">Phone</button>
  </div>
</header>
<div class="stage" id="stage">
  <div class="tv"><div class="tv-in" id="tv"></div></div>
  <div class="phone"><div class="scr" id="ph"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const COLORS=['#7c5cff','#2ee59d','#ff6b81','#ffb84d'];
const CODE='K7QX';
const S={screen:'join',players:[],me:null,count:0,timers:[]};
let keys={x:0,y:0};

// view tabs
$('tabs').onclick=e=>{const v=e.target.dataset.v;if(!v)return;
  [...$('tabs').children].forEach(b=>b.classList.toggle('on',b===e.target));
  $('stage').className='stage'+(v==='tv'?' only-tv':v==='phone'?' only-phone':'')};
if(innerWidth<1100){$('tabs').children[2].click()}

function later(fn,ms){S.timers.push(setTimeout(fn,ms))}
function reset(){S.timers.forEach(clearTimeout);S.timers=[];S.players=[];S.me=null;S.count=0;S.screen='join';draw()}

function join(name){
  S.me={id:'me',name,color:COLORS[0],ready:false,x:50,y:50};
  S.players=[{id:'h',name:'Mika',color:COLORS[1],ready:false,x:25,y:30,bot:1}];
  S.screen='lobby';draw();
  later(()=>{S.players.push({id:'j',name:'Jo',color:COLORS[2],ready:false,x:75,y:30,bot:1});draw()},1500);
  later(()=>{S.players.push({id:'s',name:'Sam',color:COLORS[3],ready:false,x:50,y:75,bot:1});draw()},3200);
  later(()=>{setReady('h');},2600);
  later(()=>{setReady('j');},4500);
  later(()=>{setReady('s');},6500);
}
const all=()=>S.me?[S.me,...S.players]:[];
function setReady(id,v=true){const p=all().find(p=>p.id===id);if(!p||S.screen!=='lobby')return;p.ready=v;draw();check()}
function check(){
  const a=all();
  if(S.screen==='lobby'&&a.length>=2&&a.every(p=>p.ready)){
    S.screen='count';S.count=3;draw();
    const t=setInterval(()=>{S.count--;
      if(S.count<=0){clearInterval(t);S.screen='game';draw();loop()}else draw()},900);
    S.timers.push(t);
  }
}

function draw(){drawTV();drawPhone()}

function drawTV(){
  const a=all();
  if(S.screen==='game'){ $('tv').innerHTML=`<div class="arena" id="arena"></div>`;return}
  const slots=[0,1,2,3].map(i=>{const p=a[i];
    return p?`<div class="slot f ${p.ready?'r':''}" style="--c:${p.color}"><div class="av"></div>${p.name}<small>${p.ready?'READY':'NOT READY'}</small></div>`
            :`<div class="slot">Waiting…</div>`}).join('');
  const rdy=a.filter(p=>p.ready).length;
  $('tv').innerHTML=`<h2>ROOM · ${a.length}/4 PLAYERS · ${rdy} READY</h2>
  <div class="codebox"><div class="qr"></div><div><div class="hint">Open on your phone and enter</div><div class="code">${CODE}</div></div></div>
  <div class="slots">${slots}</div>
  ${S.screen==='count'?`<div class="big">${S.count}</div>`:''}`;
}

function drawPhone(){
  const ph=$('ph');
  if(S.screen==='join'){
    ph.innerHTML=`<h1>Join a room</h1><p>Enter the code shown on the TV.</p>
    <div><label>ROOM CODE</label><input id="ci" class="code-in" maxlength="4" placeholder="••••" autocomplete="off"></div>
    <div><label>YOUR NAME</label><input id="ni" maxlength="10" value="You"></div>
    <div class="err" id="er"></div>
    <button class="btn" id="go">Join</button>
    <button class="btn ghost" id="demo">Fill demo code (${CODE})</button>`;
    $('demo').onclick=()=>{$('ci').value=CODE};
    $('go').onclick=()=>{
      const c=$('ci').value.toUpperCase();
      if(c!==CODE){$('er').textContent='Room not found. Check the TV.';$('ci').classList.remove('shake');void $('ci').offsetWidth;$('ci').classList.add('shake');return}
      join($('ni').value.trim()||'You')};
  }else if(S.screen==='lobby'||S.screen==='count'){
    const a=all();
    ph.innerHTML=`<div class="pill">${CODE}</div><h1>Lobby</h1><p>Everyone taps ready to start.</p>
    <div class="list">${a.map(p=>`<div class="row" style="--c:${p.color}"><div class="av"></div><span>${p.name}${p.id==='me'?' (you)':''}</span><em class="tag ${p.ready?'r':''}" style="font-style:normal">${p.ready?'Ready':'Waiting'}</em></div>`).join('')}</div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
    <button class="btn ${S.me.ready?'':'ok'}" id="rd" ${S.screen==='count'?'disabled':''}>${S.screen==='count'?'Starting '+S.count+'…':S.me.ready?'Not ready':"I'm ready"}</button>
    <button class="btn ghost" id="lv">Leave room</button></div>`;
    $('rd').onclick=()=>{navigator.vibrate&&navigator.vibrate(20);setReady('me',!S.me.ready)};
    $('lv').onclick=reset;
  }else{
    ph.innerHTML=`<div class="ctl">
      <div class="top"><b>${S.me.name}</b><span>Score <b id="sc">0</b></span><button class="btn ghost" id="ex" style="padding:2px 8px">✕</button></div>
      <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
      <div class="lbl">MOVE</div>
      <button class="ab b" id="bb">B</button><button class="ab a" id="ba">A</button></div>`;
    ph.style.padding=0;
    $('ex').onclick=()=>{ph.style.padding='';reset()};
    initStick();
    $('ba').onpointerdown=()=>{buzz();pulse()};
    $('bb').onpointerdown=()=>{buzz();pulse()};
  }
  if(S.screen!=='game')ph.style.padding='';
}
const buzz=()=>navigator.vibrate&&navigator.vibrate(15);
function pulse(){const m=document.querySelector('.pl.me');if(m){m.classList.remove('pulse');void m.offsetWidth;m.classList.add('pulse')}}

function initStick(){
  const st=$('stick'),kn=$('knob');let on=false;
  const mv=e=>{if(!on)return;const r=st.getBoundingClientRect(),R=r.width/2;
    let dx=e.clientX-(r.left+R),dy=e.clientY-(r.top+R);const d=Math.hypot(dx,dy);
    if(d>R){dx*=R/d;dy*=R/d}
    kn.style.transform=`translate(${dx}px,${dy}px)`;keys.x=dx/R;keys.y=dy/R};
  st.onpointerdown=e=>{on=true;st.setPointerCapture(e.pointerId);mv(e)};
  st.onpointermove=mv;
  st.onpointerup=st.onpointercancel=()=>{on=false;kn.style.transform='';keys={x:0,y:0}};
}

// mock game on TV
let coin={x:70,y:40},score=0;
function loop(){
  if(S.screen!=='game')return;
  const ar=$('arena');if(!ar){requestAnimationFrame(loop);return}
  const m=S.me;
  m.x=Math.max(3,Math.min(97,m.x+keys.x*0.9));m.y=Math.max(5,Math.min(95,m.y+keys.y*1.4));
  S.players.forEach(p=>{p.vx=(p.vx||0)+(Math.random()-.5)*.1;p.vy=(p.vy||0)+(Math.random()-.5)*.1;
    p.x=Math.max(3,Math.min(97,p.x+p.vx));p.y=Math.max(5,Math.min(95,p.y+p.vy))});
  if(Math.hypot(m.x-coin.x,(m.y-coin.y)*1.7)<5){score++;coin={x:8+Math.random()*84,y:10+Math.random()*80};const s=$('sc');if(s)s.textContent=score}
  ar.innerHTML=`<div class="coin" style="left:${coin.x}%;top:${coin.y}%"></div>`+all().map(p=>`<div class="pl ${p.id==='me'?'me':''}" style="--c:${p.color};left:${p.x}%;top:${p.y}%"><i>${p.name}</i></div>`).join('');
  requestAnimationFrame(loop);
}
draw();
</script>
</body>
</html>
