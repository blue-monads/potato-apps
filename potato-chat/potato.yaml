name: potato-chat
info: potato-chat
slug: potato-chat
tags:
  - "potato-executor:luaz"
  - "potato-db:sqlite"
  - "fun"
format_version: '0.0.2'
author_name: Bornjre
author_email: bornjre@gmail.com
author_site: https://github.com/bornjre
license: MIT
version: '0.0.2'

special_pages:
  init_page: init.html
  update_page: update_1.html

spaces:
  - namespace: potato-chat
    executor_type: luaz
    server_file: server.lua
    is_default: true
    route_options:
      serve_folder: public
      force_html_extension: false
      force_index_html_file: true
      on_not_found_file: index.html

capabilities:
  - name: xMigrator
    options:
      folder: migration
  - name: xUser
  - name: xWebsocket
  - name: xSqlite

developer:
  server_url: http://localhost:7777
  token: ppsec_hHS81SuHlJDQHyTq50PUCchXp9ruhnFTr1sdkRfTGTMQ2ixsc4PLw3rlY7mMqkDE2ZXwoJL4bGDn1DPIcYV4iN
  output_zip_file: package.spk.zip
  include_files:
    - 'ui/dist/**/*,public'
    - 'server/server.lua,server.lua'
    - 'server/utils.lua,utils.lua'
    - 'server/handlers.lua,handlers.lua'
    - 'server/conn_index.lua,conn_index.lua'
    - 'server/ws.lua,ws.lua'
    - 'meta/init.html,public/init.html'
    - 'server/migration/**/*.sql,migration'
  build_command: 'cd ui && { [ -d node_modules ] || bun install; } && bun run build'
